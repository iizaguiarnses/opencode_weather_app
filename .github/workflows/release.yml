name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

env:
  CRIBuild: bun build --compile index.ts --outfile

jobs:
  setup:
    name: Setup Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect package.json changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            package:
              - package.json

      - name: Extract version
        if: steps.filter.outputs.package == 'true'
        id: extract
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set git config
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Check if tag exists
        run: |
          git fetch --all --tags
          if git rev-parse -q --verify "refs/tags/${{ needs.setup.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ needs.setup.outputs.tag }} already exists"
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create release
        if: env.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: Release ${{ needs.setup.outputs.tag }}
          generate_release_notes: true

      - name: Skip if tag exists
        if: env.EXISTS == 'true'
        run: echo "Tag already exists, skipping release creation"

  build-linux:
    name: Build Linux x86_64
    needs: [setup, create-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build binary
        run: bun build --compile index.ts --outfile weather-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-linux-x86_64
          path: weather-linux-x86_64

  build-macos-intel:
    name: Build macOS x86_64
    needs: [setup, create-release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build binary
        run: bun build --compile index.ts --outfile weather-darwin-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-darwin-x86_64
          path: weather-darwin-x86_64

  build-macos-arm:
    name: Build macOS ARM64
    needs: [setup, create-release]
    runs-on: macos-14-xl
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build binary
        run: bun build --compile index.ts --outfile weather-darwin-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-darwin-aarch64
          path: weather-darwin-aarch64

  build-windows:
    name: Build Windows x86_64
    needs: [setup, create-release]
    runs-on: windows-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build binary
        run: bun build --compile index.ts --outfile weather-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-windows-x86_64
          path: weather-windows-x86_64.exe

  upload-assets:
    name: Upload Release Assets
    needs:
      [
        setup,
        build-linux,
        build-macos-intel,
        build-macos-arm,
        build-windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -laR dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/weather-linux-x86_64/*
            dist/weather-darwin-x86_64/*
            dist/weather-darwin-aarch64/*
            dist/weather-windows-x86_64/*
          prerelease: false
          make_latest: true
